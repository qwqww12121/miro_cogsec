<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="./cogsec_demo.css">
</head>
<body>

        <h1>认知安全静态前端示例</h1>
        <p class="hero-text">
          这个页面直接加载内置样例数据，用来演示 CogSec 工作台的前端结构与可视化效果，不依赖 Flask API。
        </p>
      </div>
      <div class="hero-badge">
        <span>模式</span>

      </div>

    <section class="panel input-panel">

        <div>
          <p class="eyebrow">Input</p>
          <h2>场景输入</h2>
        </div>

        </div>
      </div>

      <label class="field">
        <span>诈骗类别（可选）</span>
        <select id="scenario-type">

          <option value="虚假征信类">虚假征信类</option>
          <option value="刷单返利类">刷单返利类</option>
          <option value="虚假网络投资理财类">虚假网络投资理财类</option>
          <option value="冒充电商物流客服类">冒充电商物流客服类</option>

          <option value="虚假贷款代办信用卡类">虚假贷款代办信用卡类</option>
        </select>
      </label>

      <label class="field">
        <span>场景文本</span>
        <textarea id="scenario-input" rows="6"></textarea>
      </label>

      <div id="status-box" class="status-box idle">等待加载静态示例</div>
    </section>

    <section id="result-shell" class="result-shell hidden">
      <div class="metrics-grid" id="metrics-grid"></div>

      <div class="two-col">
        <section class="panel">
          <div class="section-head">
            <div>
              <p class="eyebrow">Profile</p>

            </div>
          </div>
          <div id="profile-groups" class="profile-groups"></div>
        </section>

        <section class="panel">
          <div class="section-head">
            <div>
              <p class="eyebrow">Outcome</p>
              <h2>最终评分对比</h2>
            </div>
          </div>
          <div id="score-summary" class="score-summary"></div>
          <div class="chart-box">
            <svg id="trend-chart" viewBox="0 0 760 280" preserveAspectRatio="none"></svg>

        <div class="section-head">

            </div>

        <div class="section-head">
          <div>
            <p class="eyebrow">JSON</p>
            <h2>原始返回</h2>
          </div>
        </div>
        <pre id="raw-json" class="raw-json"></pre>
